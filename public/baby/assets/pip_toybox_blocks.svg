<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" fill="none">
  <defs>
    <radialGradient id="warmAura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFF8F1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="brassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <circle cx="180" cy="130" r="120" fill="url(#warmAura)" />
  <ellipse cx="180" cy="222" rx="135" ry="18" fill="#EED6DF" opacity="0.65" />

  <!-- Bottom Block 'h' -->
  <g transform="translate(68, 146)">
    <rect x="0" y="0" width="70" height="70" rx="12" fill="#F4C6D7" stroke="#3A2721" stroke-width="3.5" />
    <rect x="7" y="7" width="56" height="56" rx="8" stroke="#A34063" stroke-width="1.8" stroke-dasharray="4 3" />
    <text x="35" y="47" text-anchor="middle" fill="#3A2721" font-family="Georgia, serif" font-weight="bold" font-size="36">h</text>
  </g>

  <!-- Bottom Right Block 'X' -->
  <g transform="translate(148, 146)">
    <rect x="0" y="0" width="70" height="70" rx="12" fill="#C7D2FE" stroke="#3A2721" stroke-width="3.5" />
    <rect x="7" y="7" width="56" height="56" rx="8" stroke="#4338CA" stroke-width="1.8" stroke-dasharray="4 3" />
    <text x="35" y="47" text-anchor="middle" fill="#3A2721" font-family="Georgia, serif" font-weight="bold" font-size="34">X</text>
  </g>

  <!-- Top Stacked Block 'a' -->
  <g transform="translate(104, 72) rotate(-5 35 35)">
    <rect x="0" y="0" width="70" height="70" rx="12" fill="#FDE68A" stroke="#3A2721" stroke-width="3.5" />
    <rect x="7" y="7" width="56" height="56" rx="8" stroke="#B45309" stroke-width="1.8" stroke-dasharray="4 3" />
    <text x="35" y="47" text-anchor="middle" fill="#3A2721" font-family="Georgia, serif" font-weight="bold" font-size="36">a</text>
  </g>

  <!-- Brass Star Rattle -->
  <g transform="translate(255, 128) rotate(18)">
    <rect x="-7" y="25" width="14" height="68" rx="7" fill="#FFF8F1" stroke="#3A2721" stroke-width="3" />
    <circle cx="0" cy="95" r="10" fill="url(#brassGold)" stroke="#3A2721" stroke-width="2.5" />
    <path d="M-24 22 C-10 10 10 10 24 22 C14 32 -14 32 -24 22 Z" fill="#F472B6" stroke="#3A2721" stroke-width="2.5" />
    <polygon points="0,-36 10,-12 36,-10 16,7 22,32 0,18 -22,32 -16,7 -36,-10 -10,-12" fill="url(#brassGold)" stroke="#3A2721" stroke-width="3" stroke-linejoin="round" />
    <circle cx="0" cy="-2" r="7" fill="#FFFBEB" />
  </g>

  <!-- Floating Acoustic Notes -->
  <text x="58" y="68" fill="#A34063" font-size="22" font-weight="bold">♪</text>
  <text x="292" y="64" fill="#D97706" font-size="20" font-weight="bold">★</text>
  <text x="208" y="54" fill="#A34063" font-size="18" font-weight="bold">♡</text>
</svg>
